<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Observatory — Ask the Archive</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      background: #faf8f4;
      color: #2b2b2b;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: linear-gradient(180deg, #070b1d 0%, #101a3c 60%, #23356e 100%);
      color: #f5f2ea;
      padding: 1.2rem 1.5rem;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 1.3rem; font-weight: normal; }
    header .sub {
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 0.7rem;
      color: #9fb0dd;
    }
    #history {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .msg {
      max-width: 85%;
      margin-bottom: 1rem;
      padding: 0.8rem 1rem;
      border-radius: 10px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .msg.user {
      background: #1b2a52;
      color: #f5f2ea;
      margin-left: auto;
    }
    .msg.bot { background: #efece5; }
    .msg.error { background: #f3ddda; color: #7a2e22; }
    .msg.thinking { background: #efece5; color: #8a857c; font-style: italic; }
    .sources { margin-top: 0.6rem; font-size: 0.85rem; }
    .sources a {
      display: block;
      color: #2a4ba8;
      text-decoration: none;
      margin-top: 0.25rem;
    }
    .sources a:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0 0.4rem;
      border-radius: 4px;
      background: #1b2a52;
      color: #f5f2ea;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
    .badge.paper { background: #6b3fa0; }
    form {
      display: flex;
      gap: 0.6rem;
      padding: 1rem 1.5rem 1.5rem;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    input {
      flex: 1;
      font: inherit;
      padding: 0.7rem 0.9rem;
      border: 1px solid #c9c2b4;
      border-radius: 8px;
      background: #fff;
    }
    input:focus { outline: 2px solid #23356e; }
    button {
      font: inherit;
      padding: 0.7rem 1.3rem;
      border: none;
      border-radius: 8px;
      background: #1b2a52;
      color: #f5f2ea;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
  </style>
</head>
<body>

<header>
  <div class="sub">Observatory</div>
  <h1>Ask the Archive</h1>
  <nav style="margin-top: 0.6rem;">
    <a href="/" style="color: #9fb0dd; text-decoration: none; font-size: 0.85rem;">
      &larr; Back to the magazine</a>
  </nav>
</header>

<div id="history"></div>

<form id="form">
  <input id="question" type="text" placeholder="e.g. what is new about exoplanets?"
         autocomplete="off" autofocus>
  <button id="send" type="submit">Ask</button>
</form>

<script>
  const history = document.getElementById("history");
  const form = document.getElementById("form");
  const input = document.getElementById("question");
  const sendButton = document.getElementById("send");

  // Append one message bubble to the history and scroll to it.
  function addMessage(cssClass, text) {
    const div = document.createElement("div");
    div.className = "msg " + cssClass;
    div.textContent = text;
    history.appendChild(div);
    history.scrollTop = history.scrollHeight;
    return div;
  }

  // Append the clickable source list under an answer bubble.
  function addSources(bubble, sources) {
    if (!sources.length) return;
    const box = document.createElement("div");
    box.className = "sources";
    for (const s of sources) {
      const link = document.createElement("a");
      link.href = s.url;
      link.target = "_blank";
      link.rel = "noopener";

      const badge = document.createElement("span");
      badge.className = "badge " + s.doc_type;
      badge.textContent = s.doc_type;

      link.appendChild(badge);
      link.appendChild(document.createTextNode(`[${s.number}] ${s.title}`));
      box.appendChild(link);
    }
    bubble.appendChild(box);
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();  // don't reload the page (default form behavior)
    const question = input.value.trim();
    if (!question) return;

    addMessage("user", question);
    input.value = "";
    sendButton.disabled = true;
    const thinking = addMessage("thinking", "Searching the archive…");

    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      thinking.remove();
      if (!response.ok) {
        const detail = (await response.json()).detail || response.statusText;
        addMessage("error", "Error: " + detail);
        return;
      }
      const data = await response.json();
      const bubble = addMessage("bot", data.answer);
      addSources(bubble, data.sources);
    } catch (err) {
      thinking.remove();
      addMessage("error", "Network error: " + err.message);
    } finally {
      sendButton.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
